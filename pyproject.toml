[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "perkflow"
version = "0.1.0"
description = "Local-life backend with future AI Agent extensions"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "SQLAlchemy[asyncio]>=2.0.34,<2.1",
    "aiomysql>=0.2,<1",
    "cryptography>=43,<50",
    "alembic>=1.13,<2",
    "redis>=5.2,<6",
    "aio-pika>=9.6,<10",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1", "ruff>=0.6,<1"]
loadtest = ["locust==2.46.7"]

[tool.setuptools.packages.find]
include = ["backend*", "agent*"]

[tool.setuptools.package-data]
"backend.app.core" = ["lua/*.lua"]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "mysql: requires an explicitly configured isolated MySQL test database",
    "redis: requires an explicitly configured Redis test prefix",
    "rabbitmq: requires explicit opt-in and isolated RabbitMQ topology",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
